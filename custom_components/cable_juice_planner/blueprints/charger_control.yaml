blueprint:
  name: Cable Juice Planner - charger control
  description: >
    Carries out Cable Juice Planner's actions on the charger and/or the car: enable/disable,
    start/stop, charging current per phase and the car's charge limit. Create one automation
    per car – select the car's "Charger action".


    **All actions are optional.** For each task, fill in the action where your setup can do
    it – in the charger, in the car or both. E.g. start/stop and charging current in the
    charger and the charge limit in the car, or start/stop and charge limit in the car and
    charging current in the charger. If neither the charger nor the car can set the charging
    current, the blueprint just starts and stops charging.


    **Order on start:** enable the charger → circuit limit → charging current in the charger →
    charging current in the car → start the charger → (optional wait) → start the car, with an
    optional pause between two charger commands (Wait between charger commands). On stop,
    both the charger and the car are stopped. If one action fails (e.g. the charger's cloud does
    not answer), the error is logged and the rest still run, so the car is still told to charge.


    **One run per change:** the automation runs once each time Cable Juice Planner changes its
    decision, and carries out everything that changed (the `changed` variable in the trace,
    e.g. `['action', 'amps', 'circuit']`), so each trace shows one whole decision.


    **Circuit limit (optional, e.g. an Easee master):** if several chargers share one circuit
    limit, fill in "Set circuit current" **only in the automation of the car whose charger is
    the master** (the charger the circuit is controlled from). Leave it empty in the other
    cars' automations. Link the chargers under the car's *Load balancing* settings (Chargers
    on the same circuit); every car of the circuit then gets the sum per phase of all the
    circuit's chargers, so the master's automation sets the right limit for all of them.


    **Fail-safe:** if `charger_action` is unavailable, or no new plan has been calculated for
    the selected number of minutes (the `updated` attribute), it charges with the fail-safe
    current, so the car is not left without power if the integration has stopped or hangs.
    The integration itself sets `mode: error` and max amps when the calculation fails. This is
    carried out as a normal action.


    **Charging state (optional):** a status sensor, a "charging" switch/binary sensor or a
    power sensor tells the blueprint whether it is charging. Start is then not repeated while
    charging or when the charger/car reports done (e.g. `completed`/`finished` – the car is
    full or has reached its charge limit), and the integrations can be restarted if it is not
    charging.


    **Restart (optional):** if the action has been `charge` for the selected number of
    minutes without charging, your restart actions are run (e.g. reload the charger's or the
    car's integration) – at most the selected number of times.


    In the actions you can use the variables `phase_1`, `phase_2`, `phase_3` (amps),
    `max_phase` (highest phase), `phases` (number of phases in use), `circuit_phase_1`,
    `circuit_phase_2`, `circuit_phase_3` (circuit limit in amps), `charging_limit` (the car's
    charge limit in %), `charger_enabled`, `fail_safe` (true in fail-safe) and `message` (in the
    notification).
  domain: automation
  source_url: https://github.com/dezito/Cable-Juice-Planner-HACS/blob/main/custom_components/cable_juice_planner/blueprints/charger_control.yaml
  input:
    planner:
      name: Cable Juice Planner
      icon: mdi:ev-station
      input:
        action_sensor:
          name: Charger action
          description: >
            The car's sensor.cjp_<prefix>_charger_action. The charging current per phase and
            the charge limit are read from its attributes (phase_1_amps, phase_2_amps,
            phase_3_amps, charging_limit). The automation runs when its decision attribute
            changes: once per change, with everything that changed in that run.
          selector:
            entity:
              filter:
                - integration: cable_juice_planner
                  domain: sensor
                  device_class: enum
    charger:
      name: Charger
      icon: mdi:ev-plug-type2
      collapsed: true
      input:
        start_actions:
          name: Start charging
          description: >
            What makes the charger charge: the charger's own service (e.g. start/resume in
            Easee, Zaptec or Wallbox), a start/stop switch (e.g. Monta, OCPP, go-e) or a
            button.
          default: []
          selector:
            action: {}
        stop_actions:
          name: Stop charging
          description: >
            The opposite of start: the stop/pause service or the switch turned off. If the
            charger pauses at 0 A, setting the charging current is enough (it is set to 0 on
            stop).
          default: []
          selector:
            action: {}
        amps_actions:
          name: Set charging current
          description: >
            The charger's charging current limit: a dynamic limit service (e.g. Easee, Zaptec)
            or a number entity (e.g. OCPP, go-e, Wallbox) set to "{{ max_phase }}". If the
            charger takes the current per phase, use "{{ phase_1 }}", "{{ phase_2 }}" and
            "{{ phase_3 }}" (0 = the phase is not used). Run when the current changes and
            before start.
          default: []
          selector:
            action: {}
        circuit_actions:
          name: Set circuit current (master only)
          description: >
            Only for chargers controlled through a circuit limit (e.g. an Easee master), and
            **only in the automation of the car whose charger is the master** – leave it empty
            in the other cars' automations on the same circuit, the master's automation sets
            the circuit for all of them. E.g. easee.set_circuit_dynamic_limit with current_p1:
            "{{ circuit_phase_1 }}", current_p2: "{{ circuit_phase_2 }}" and current_p3:
            "{{ circuit_phase_3 }}". With chargers linked under Load balancing (Chargers on the
            same circuit) it is the sum per grid phase of all the circuit's chargers (0 when
            none of them charges); without, it is this charger's own circuit limit. In
            fail-safe it is the fail-safe current, shared by the circuit's chargers. Run when
            the circuit limit changes and before start.
          default: []
          selector:
            action: {}
        enable_actions:
          name: Enable the charger
          description: >
            When the charger_enabled attribute becomes true (the integration restarts the
            charger if it does not start charging), e.g. switch.turn_on on the charger's
            "enabled" switch. Select the entity, not the whole device – otherwise all the
            charger's switches are turned on.
          default: []
          selector:
            action: {}
        disable_actions:
          name: Disable the charger
          description: When the charger_enabled attribute becomes false (first half of the restart).
          default: []
          selector:
            action: {}
        command_delay:
          name: Wait between charger commands
          description: >
            Seconds between two commands to the charger in the same run (enable/disable,
            circuit current, charging current, start/stop), for a charger or cloud that should
            not get commands right after each other (e.g. 2–5 s for Easee). There is no wait
            before the first command, and the car's commands are not delayed by it (see Wait
            before starting the car). 0 = no wait.
          default: 0
          selector:
            number:
              min: 0
              max: 30
              step: 1
              unit_of_measurement: s
              mode: box
    car:
      name: Car
      icon: mdi:car-electric
      collapsed: true
      input:
        car_start_actions:
          name: Start charging in the car
          description: >
            The car's charge switch or start service from the car's integration (e.g.
            Tesla/Tessie, VW/Cupra/Skoda/Audi, Kia/Hyundai, Mercedes, Ford, the Stellantis
            cars). Often used when the charger cannot be controlled.
          default: []
          selector:
            action: {}
        car_start_delay:
          name: Wait before starting the car
          description: >
            Seconds between the charger's actions (enable, charging current, start) and
            "Start charging in the car", so the charger is ready before the car is told to
            charge. 0 = no wait. Only used when the car is started.
          default: 0
          selector:
            number:
              min: 0
              max: 300
              step: 5
              unit_of_measurement: s
              mode: box
        car_stop_actions:
          name: Stop charging in the car
          description: The opposite of start – the switch turned off or the stop service.
          default: []
          selector:
            action: {}
        car_amps_actions:
          name: Set charging current in the car
          description: >
            Only if the car can set the charging current (e.g. a "charge current" number) –
            number.set_value with value: "{{ max_phase }}". If neither the charger nor the car
            can control the current, the car charges with what it can, and solar surplus/load
            balancing cannot regulate it. Run when the current changes and before start (never
            with 0 A).
          default: []
          selector:
            action: {}
        car_limit_actions:
          name: Set charge limit in the car
          description: >
            The car's charge limit (e.g. "charge limit" or "target state of charge") –
            number.set_value with value: "{{ charging_limit }}". Run when the integration
            changes the charge limit and before start. Requires the car's integration to be
            set up in Cable Juice Planner (without it the charge limit is not known).
          default: []
          selector:
            action: {}
    state:
      name: Charging state
      icon: mdi:battery-charging
      collapsed: true
      input:
        charger_status:
          name: Status or "charging" entity (optional)
          description: >
            The charger's or the car's status sensor (e.g. charging/completed) or a switch /
            binary sensor that is on while charging. Adjust the two lists below to the states
            your entity has (see its history).
          default: ""
          selector:
            entity:
              filter:
                - domain: [sensor, binary_sensor, switch]
        charging_states:
          name: States that mean charging
          description: E.g. charging, Charging or on.
          default: [charging, "on"]
          selector:
            select:
              multiple: true
              custom_value: true
              options: [charging, "on"]
        completed_states:
          name: States that mean done
          description: >
            The car is full or has reached its charge limit (like CHARGER_COMPLETED_STATUS),
            e.g. completed, finished, Finishing or charge_complete.
          default: [completed, finished]
          selector:
            select:
              multiple: true
              custom_value: true
              options: [completed, finished]
        power_sensor:
          name: Charging power (optional)
          description: >
            If there is no status: a power sensor for the charger or the car. Above the
            threshold below, it counts as charging. Used together with the status if both are
            set.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: power
        power_threshold:
          name: Charging above
          description: >
            Only when Charging power is selected: the power must be above this value before it
            counts as charging. Keep it above the charger's/car's standby consumption and below
            the lowest charging power (6 A on 1 phase ≈ 1400 W). Used to not repeat start while
            charging, and to see whether to restart.
          default: 500
          selector:
            number:
              min: 50
              max: 5000
              step: 50
              unit_of_measurement: W
              mode: box
    restart:
      name: Restart when not charging
      icon: mdi:restart-alert
      collapsed: true
      input:
        restart_actions:
          name: Restart actions
          description: >
            Run when the action has been charge for the selected number of minutes without
            charging (requires Charging state). E.g. homeassistant.reload_config_entry with one
            of the charger's or the car's entities as target – it reloads that whole
            integration.
          default: []
          selector:
            action: {}
        restart_minutes:
          name: Restart after
          default: 10
          selector:
            number:
              min: 5
              max: 120
              step: 5
              unit_of_measurement: min
              mode: box
        restart_max:
          name: Max number of restarts
          description: Each time the action changes to charge.
          default: 3
          selector:
            number:
              min: 1
              max: 10
              step: 1
              mode: box
    fail_safe:
      name: Fail-safe
      icon: mdi:shield-car
      collapsed: true
      input:
        fail_safe_minutes:
          name: Fail-safe after
          description: >
            Minutes without a new calculation (or with an unavailable action) before charging
            with the fail-safe current. Should be at least 3 times the integration's interval.
          default: 20
          selector:
            number:
              min: 5
              max: 240
              step: 5
              unit_of_measurement: min
              mode: box
        fail_safe_amps:
          name: Fail-safe charging current
          default: 16
          selector:
            number:
              min: 6
              max: 32
              step: 1
              unit_of_measurement: A
              mode: box
        fail_safe_phases:
          name: Fail-safe phases
          default: 3
          selector:
            number:
              min: 1
              max: 3
              step: 1
              mode: box
        notify_actions:
          name: Notification
          description: >
            On fail-safe, restart and when the integration reports mode error. The message
            variable holds the text, e.g. a notify service with message: "{{ message }}".
          default: []
          selector:
            action: {}

mode: queued
max: 10

triggers:
  # the decision attribute holds the action, enabled, mode, amps, circuit and charge limit:
  # one run per change, however many of them changed (the changed variable tells which)
  - trigger: state
    entity_id: !input action_sensor
    attribute: decision
    id: change
  - trigger: state
    entity_id: !input action_sensor
    to: [unavailable, unknown]
    for:
      minutes: !input fail_safe_minutes
    id: fail_safe
  - trigger: time_pattern
    minutes: /5
    id: watchdog
  - trigger: homeassistant
    event: start
    id: start

variables:
  action_sensor: !input action_sensor
  charger_status: !input charger_status
  charging_states: !input charging_states
  completed_states: !input completed_states
  power_sensor: !input power_sensor
  power_threshold: !input power_threshold
  restart_minutes: !input restart_minutes
  restart_max: !input restart_max
  fail_safe_minutes: !input fail_safe_minutes
  fail_safe_amps: !input fail_safe_amps
  car_start_delay: !input car_start_delay
  command_delay: !input command_delay
  fail_safe_phases: !input fail_safe_phases
  action: "{{ states(action_sensor) }}"
  charger_mode: "{{ state_attr(action_sensor, 'mode') or 'normal' }}"
  # missing = enabled; default(true, true) would also turn false into true
  charger_enabled: >
    {% set enabled = state_attr(action_sensor, 'charger_enabled') %}
    {{ enabled is none or enabled | bool(true) }}
  charging_limit: "{{ state_attr(action_sensor, 'charging_limit') | int(0) }}"
  fail_safe: >
    {% set s = states[action_sensor] %}
    {% if s is none %}
      true
    {% elif s.state not in ['charge', 'stop'] %}
      {{ (now() - s.last_changed).total_seconds() > fail_safe_minutes * 60 }}
    {% else %}
      {% set updated = as_timestamp(s.attributes.get('updated'), 0) %}
      {{ updated > 0 and (as_timestamp(now()) - updated) > fail_safe_minutes * 60 }}
    {% endif %}
  already_charging: >
    {{ (charger_status != '' and states(charger_status) in charging_states)
       or (power_sensor != '' and states(power_sensor) | float(0) * (1000 if state_attr(power_sensor, 'unit_of_measurement') == 'kW' else 1) > power_threshold) }}
  has_charging_state: "{{ charger_status != '' or power_sensor != '' }}"
  # minutes the action has been charge (last_changed only moves when the state changes)
  charge_minutes: >
    {% set s = states[action_sensor] %}
    {{ ((now() - s.last_changed).total_seconds() / 60) | int if s is not none and s.state == 'charge' else 0 }}
  restart_attempt: "{{ ((charge_minutes - restart_minutes) // restart_minutes) + 1 if charge_minutes >= restart_minutes else 0 }}"
  charger_done: "{{ charger_status != '' and states(charger_status) in completed_states }}"
  phase_1: "{{ (fail_safe_amps if fail_safe else state_attr(action_sensor, 'phase_1_amps')) | int(0) }}"
  phase_2: "{{ (fail_safe_amps if fail_safe and fail_safe_phases >= 2 else 0 if fail_safe else state_attr(action_sensor, 'phase_2_amps')) | int(0) }}"
  phase_3: "{{ (fail_safe_amps if fail_safe and fail_safe_phases >= 3 else 0 if fail_safe else state_attr(action_sensor, 'phase_3_amps')) | int(0) }}"
  max_phase: "{{ [phase_1, phase_2, phase_3] | max }}"
  phases: "{{ [phase_1, phase_2, phase_3] | select('gt', 0) | list | count }}"
  # circuit limit (sum of the circuit's chargers when they are linked under Load balancing)
  circuit_phase_1: "{{ phase_1 if fail_safe else state_attr(action_sensor, 'circuit_phase_1_amps') | int(0) }}"
  circuit_phase_2: "{{ phase_2 if fail_safe else state_attr(action_sensor, 'circuit_phase_2_amps') | int(0) }}"
  circuit_phase_3: "{{ phase_3 if fail_safe else state_attr(action_sensor, 'circuit_phase_3_amps') | int(0) }}"
  # what this change changed: action, enabled, mode, amps, circuit and/or limit
  changed: >
    {% set ns = namespace(items=[]) %}
    {% if trigger.id == 'change' and trigger.to_state %}
      {% set before = trigger.from_state.attributes if trigger.from_state else {} %}
      {% set after = trigger.to_state.attributes %}
      {% if not trigger.from_state or trigger.from_state.state != trigger.to_state.state %}
        {% set ns.items = ns.items + ['action'] %}
      {% endif %}
      {% for name, keys in [
           ('enabled', ['charger_enabled']),
           ('mode', ['mode']),
           ('amps', ['phase_1_amps', 'phase_2_amps', 'phase_3_amps']),
           ('circuit', ['circuit_phase_1_amps', 'circuit_phase_2_amps', 'circuit_phase_3_amps']),
           ('limit', ['charging_limit'])] %}
        {% set diff = namespace(found=false) %}
        {% for key in keys %}
          {% if before.get(key) != after.get(key) %}{% set diff.found = true %}{% endif %}
        {% endfor %}
        {% if diff.found %}{% set ns.items = ns.items + [name] %}{% endif %}
      {% endfor %}
    {% endif %}
    {{ ns.items }}
  # a new action (or Home Assistant start / back from unavailable): the whole start or stop
  whole_decision: "{{ trigger.id in ['start', 'fail_safe'] or 'action' in changed }}"

actions:
  - choose:
      # ---- fail-safe: the planner is gone or does not calculate any more ----
      - conditions:
          - condition: template
            value_template: "{{ fail_safe }}"
        sequence:
          # not while it charges, and not when the charger says the car is done
          - if:
              - condition: template
                value_template: "{{ not already_charging and not charger_done }}"
            then:
              - variables:
                  message: >
                    Cable Juice Planner has not updated {{ action_sensor }} for over
                    {{ fail_safe_minutes }} min (action: {{ action }}). Charging with fail-safe
                    {{ fail_safe_amps }} A on {{ fail_safe_phases }} phase(s).
              - continue_on_error: true
                sequence: !input enable_actions
              # pause between two charger commands (Wait between charger commands), reused below
              - &pause
                if:
                  - condition: template
                    value_template: "{{ command_delay > 0 }}"
                then:
                  - delay: "{{ command_delay }}"
              - continue_on_error: true
                sequence: !input circuit_actions
              - *pause
              - continue_on_error: true
                sequence: !input amps_actions
              - continue_on_error: true
                sequence: !input car_amps_actions
              - *pause
              - continue_on_error: true
                sequence: !input start_actions
              - if:
                  - condition: template
                    value_template: "{{ car_start_delay > 0 }}"
                then:
                  - delay: "{{ car_start_delay }}"
              - continue_on_error: true
                sequence: !input car_start_actions
              # notify when the fail-safe starts and at most once an hour while it lasts
              - if:
                  - condition: template
                    value_template: "{{ trigger.id != 'watchdog' or now().minute < 5 }}"
                then:
                  - continue_on_error: true
                    sequence: !input notify_actions
      # ---- charging was asked for but does not happen: restart the integrations ----
      - conditions:
          - condition: template
            value_template: >
              {{ trigger.id == 'watchdog' and has_charging_state and action == 'charge' and charger_enabled
                 and not already_charging and not charger_done
                 and 1 <= restart_attempt <= restart_max
                 and (charge_minutes - restart_minutes) % restart_minutes < 5 }}
        sequence:
          - variables:
              message: >
                Not charging, although Cable Juice Planner has asked for it for
                {{ charge_minutes }} min. Restarting (attempt {{ restart_attempt }} of
                {{ restart_max }}).
          - continue_on_error: true
            sequence: !input restart_actions
          - continue_on_error: true
            sequence: !input notify_actions
          # after the restart: send the current decision again
          - delay: 60
          - continue_on_error: true
            sequence: !input enable_actions
          - *pause
          - continue_on_error: true
            sequence: !input circuit_actions
          - *pause
          - continue_on_error: true
            sequence: !input amps_actions
          - if:
              - condition: template
                value_template: "{{ max_phase > 0 }}"
            then:
              - continue_on_error: true
                sequence: !input car_amps_actions
          - *pause
          - continue_on_error: true
            sequence: !input start_actions
          - if:
              - condition: template
                value_template: "{{ car_start_delay > 0 }}"
            then:
              - delay: "{{ car_start_delay }}"
          - continue_on_error: true
            sequence: !input car_start_actions
      # ---- the integration reports an error (it already asks for max amps) ----
      - conditions:
          - condition: template
            value_template: "{{ 'mode' in changed and charger_mode == 'error' }}"
        sequence:
          - variables:
              message: >
                Cable Juice Planner could not calculate the charging plan and is charging
                with max current. See the notifications in Home Assistant.
          - continue_on_error: true
            sequence: !input notify_actions
          - continue_on_error: true
            sequence: !input circuit_actions
          - *pause
          - continue_on_error: true
            sequence: !input amps_actions
          - if:
              - condition: template
                value_template: "{{ max_phase > 0 }}"
            then:
              - continue_on_error: true
                sequence: !input car_amps_actions
          - if:
              - condition: template
                value_template: "{{ not charger_done }}"
            then:
              - *pause
              - continue_on_error: true
                sequence: !input start_actions
              - if:
                  - condition: template
                    value_template: "{{ car_start_delay > 0 }}"
                then:
                  - delay: "{{ car_start_delay }}"
              - continue_on_error: true
                sequence: !input car_start_actions
      # ---- normal operation: everything this change changed, in one run ----
      - conditions:
          - condition: template
            value_template: "{{ (whole_decision or changed | count > 0) and action in ['charge', 'stop'] }}"
        sequence:
          # enabled on its own (with a new action the start below enables the charger)
          - if:
              - condition: template
                value_template: "{{ 'enabled' in changed and not charger_enabled }}"
            then:
              - continue_on_error: true
                sequence: !input disable_actions
              # pause when more charger commands follow
              - if:
                  - condition: template
                    value_template: "{{ command_delay > 0 and (whole_decision or 'circuit' in changed or 'amps' in changed) }}"
                then:
                  - delay: "{{ command_delay }}"
          - if:
              - condition: template
                value_template: "{{ 'enabled' in changed and charger_enabled and not whole_decision }}"
            then:
              - continue_on_error: true
                sequence: !input enable_actions
              - if:
                  - condition: template
                    value_template: "{{ command_delay > 0 and ('circuit' in changed or 'amps' in changed) }}"
                then:
                  - delay: "{{ command_delay }}"
          - if:
              - condition: template
                value_template: "{{ whole_decision }}"
            then:
              - if:
                  - condition: template
                    value_template: "{{ charger_enabled }}"
                then:
                  - continue_on_error: true
                    sequence: !input enable_actions
                  - *pause
              - if:
                  - condition: template
                    value_template: "{{ action == 'charge' }}"
                then:
                  - if:
                      - condition: template
                        value_template: "{{ charging_limit > 0 }}"
                    then:
                      - continue_on_error: true
                        sequence: !input car_limit_actions
                  - continue_on_error: true
                    sequence: !input circuit_actions
                  - *pause
                  - continue_on_error: true
                    sequence: !input amps_actions
                  - if:
                      - condition: template
                        value_template: "{{ max_phase > 0 }}"
                    then:
                      - continue_on_error: true
                        sequence: !input car_amps_actions
                  # a new charge decision always starts; after a restart only when not charging/done
                  - if:
                      - condition: template
                        value_template: "{{ 'action' in changed or not (already_charging or charger_done) }}"
                    then:
                      - *pause
                      - continue_on_error: true
                        sequence: !input start_actions
                      - if:
                          - condition: template
                            value_template: "{{ car_start_delay > 0 }}"
                        then:
                          - delay: "{{ car_start_delay }}"
                      - continue_on_error: true
                        sequence: !input car_start_actions
                else:
                  - continue_on_error: true
                    sequence: !input stop_actions
                  - continue_on_error: true
                    sequence: !input car_stop_actions
                  - *pause
                  - continue_on_error: true
                    sequence: !input amps_actions
                  - *pause
                  - continue_on_error: true
                    sequence: !input circuit_actions
            # the same action: only what changed
            else:
              - if:
                  - condition: template
                    value_template: "{{ 'limit' in changed and charging_limit > 0 }}"
                then:
                  - continue_on_error: true
                    sequence: !input car_limit_actions
              - if:
                  - condition: template
                    value_template: "{{ 'circuit' in changed }}"
                then:
                  - continue_on_error: true
                    sequence: !input circuit_actions
                  - if:
                      - condition: template
                        value_template: "{{ command_delay > 0 and 'amps' in changed }}"
                    then:
                      - delay: "{{ command_delay }}"
              - if:
                  - condition: template
                    value_template: "{{ 'amps' in changed }}"
                then:
                  - continue_on_error: true
                    sequence: !input amps_actions
                  - if:
                      - condition: template
                        value_template: "{{ max_phase > 0 }}"
                    then:
                      - continue_on_error: true
                        sequence: !input car_amps_actions
