blueprint:
  name: Cable Juice Planner - styr laderen
  description: >
    Udfører Cable Juice Planners handlinger på din lader: tænd/sluk, start/stop og
    ladestrøm pr. fase.


    **Fail-safe:** er `charger_action` utilgængelig, eller er der ikke regnet en ny plan i
    det valgte antal minutter (attributten `updated`), lades der med fail-safe-strømmen, så
    bilen ikke står uden strøm, hvis integrationen er stoppet eller hænger. Integrationen
    sætter selv `mode: error` og maks. ampere, når beregningen fejler, og `mode:
    deactivated`, når scriptet er slået fra. Begge dele udføres som normale handlinger.


    I handlingerne kan du bruge variablerne `phase_1`, `phase_2`, `phase_3` (ampere),
    `max_phase` (højeste fase), `phases` (antal faser i brug), `charger_enabled`,
    `fail_safe` (true i fail-safe) og `message` (i notifikationen).
  domain: automation
  source_url: https://github.com/dezito/Cable-Juice-Planner-HACS/blob/main/custom_components/cable_juice_planner/blueprints/charger_control.yaml
  input:
    planner:
      name: Cable Juice Planner
      icon: mdi:ev-station
      input:
        action_sensor:
          name: Lader handling
          description: sensor.cjp_<prefix>_charger_action
          selector:
            entity:
              filter:
                - integration: cable_juice_planner
                  domain: sensor
        phase_1_sensor:
          name: Fase 1 ampere
          description: sensor.cjp_<prefix>_charger_phase_1_amps
          selector:
            entity:
              filter:
                - integration: cable_juice_planner
                  domain: sensor
        phase_2_sensor:
          name: Fase 2 ampere
          description: sensor.cjp_<prefix>_charger_phase_2_amps
          selector:
            entity:
              filter:
                - integration: cable_juice_planner
                  domain: sensor
        phase_3_sensor:
          name: Fase 3 ampere
          description: sensor.cjp_<prefix>_charger_phase_3_amps
          selector:
            entity:
              filter:
                - integration: cable_juice_planner
                  domain: sensor
    charger:
      name: Lader
      icon: mdi:ev-plug-type2
      input:
        start_actions:
          name: Start ladning
          description: F.eks. easee.action_command resume eller switch.turn_on
          default: []
          selector:
            action: {}
        stop_actions:
          name: Stop ladning
          description: F.eks. easee.action_command pause eller switch.turn_off
          default: []
          selector:
            action: {}
        amps_actions:
          name: Sæt ladestrøm
          description: >
            F.eks. easee.set_charger_dynamic_limit med current: "{{ max_phase }}" eller
            current_p1/p2/p3. Køres når strømmen ændres og før start.
          default: []
          selector:
            action: {}
        enable_actions:
          name: Tænd laderen
          description: Når attributten charger_enabled bliver true (genstart af laderen).
          default: []
          selector:
            action: {}
        disable_actions:
          name: Sluk laderen
          description: Når attributten charger_enabled bliver false (genstart af laderen).
          default: []
          selector:
            action: {}
        charger_status:
          name: Laderens status (valgfri)
          description: Bruges i fail-safe, så start-kommandoen ikke gentages mens laderen allerede lader.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
        charging_states:
          name: Status der betyder lader
          default: [charging]
          selector:
            select:
              multiple: true
              custom_value: true
              options: [charging]
    fail_safe:
      name: Fail-safe
      icon: mdi:shield-car
      input:
        fail_safe_minutes:
          name: Fail-safe efter
          description: >
            Minutter uden ny beregning (eller med utilgængelig handling) før der lades med
            fail-safe-strømmen. Bør være mindst 3 gange integrationens interval.
          default: 20
          selector:
            number:
              min: 5
              max: 240
              step: 5
              unit_of_measurement: min
              mode: box
        fail_safe_amps:
          name: Fail-safe ladestrøm
          default: 16
          selector:
            number:
              min: 6
              max: 32
              step: 1
              unit_of_measurement: A
              mode: box
        fail_safe_phases:
          name: Fail-safe faser
          default: 3
          selector:
            number:
              min: 1
              max: 3
              step: 1
              mode: box
        notify_actions:
          name: Notifikation
          description: >
            Ved fail-safe og når integrationen melder mode error. Variablen message har
            teksten, f.eks. notify.mobile_app_telefon med message: "{{ message }}".
          default: []
          selector:
            action: {}

mode: queued
max: 10

triggers:
  - trigger: state
    entity_id: !input action_sensor
    to: ~
    id: action
  - trigger: state
    entity_id: !input action_sensor
    attribute: charger_enabled
    id: enabled
  - trigger: state
    entity_id: !input action_sensor
    attribute: mode
    id: mode
  - trigger: state
    entity_id:
      - !input phase_1_sensor
      - !input phase_2_sensor
      - !input phase_3_sensor
    to: ~
    id: amps
  - trigger: state
    entity_id: !input action_sensor
    to: [unavailable, unknown]
    for:
      minutes: !input fail_safe_minutes
    id: fail_safe
  - trigger: time_pattern
    minutes: /5
    id: watchdog
  - trigger: homeassistant
    event: start
    id: start

variables:
  action_sensor: !input action_sensor
  phase_1_sensor: !input phase_1_sensor
  phase_2_sensor: !input phase_2_sensor
  phase_3_sensor: !input phase_3_sensor
  charger_status: !input charger_status
  charging_states: !input charging_states
  fail_safe_minutes: !input fail_safe_minutes
  fail_safe_amps: !input fail_safe_amps
  fail_safe_phases: !input fail_safe_phases
  action: "{{ states(action_sensor) }}"
  charger_mode: "{{ state_attr(action_sensor, 'mode') or 'normal' }}"
  charger_enabled: "{{ state_attr(action_sensor, 'charger_enabled') | default(true, true) | bool }}"
  fail_safe: >
    {% set s = states[action_sensor] %}
    {% if s is none %}
      true
    {% elif s.state not in ['charge', 'stop'] %}
      {{ (now() - s.last_changed).total_seconds() > fail_safe_minutes * 60 }}
    {% else %}
      {% set updated = as_timestamp(s.attributes.get('updated'), 0) %}
      {{ updated > 0 and (as_timestamp(now()) - updated) > fail_safe_minutes * 60 }}
    {% endif %}
  already_charging: "{{ charger_status != '' and states(charger_status) in charging_states }}"
  phase_1: "{{ (fail_safe_amps if fail_safe else states(phase_1_sensor)) | int(0) }}"
  phase_2: "{{ (fail_safe_amps if fail_safe and fail_safe_phases >= 2 else 0 if fail_safe else states(phase_2_sensor)) | int(0) }}"
  phase_3: "{{ (fail_safe_amps if fail_safe and fail_safe_phases >= 3 else 0 if fail_safe else states(phase_3_sensor)) | int(0) }}"
  max_phase: "{{ [phase_1, phase_2, phase_3] | max }}"
  phases: "{{ [phase_1, phase_2, phase_3] | select('gt', 0) | list | count }}"

actions:
  - choose:
      # ---- fail-safe: the planner is gone or does not calculate any more ----
      - conditions: "{{ fail_safe }}"
        sequence:
          - if: "{{ not already_charging }}"
            then:
              - variables:
                  message: >
                    Cable Juice Planner har ikke opdateret {{ action_sensor }} i over
                    {{ fail_safe_minutes }} min (handling: {{ action }}). Lader med fail-safe
                    {{ fail_safe_amps }} A på {{ fail_safe_phases }} fase(r).
              - sequence: !input enable_actions
              - sequence: !input amps_actions
              - sequence: !input start_actions
              # notify when the fail-safe starts and at most once an hour while it lasts
              - if: "{{ trigger.id != 'watchdog' or now().minute < 5 }}"
                then:
                  - sequence: !input notify_actions
      # ---- the integration reports an error (it already asks for max amps) ----
      - conditions: "{{ trigger.id == 'mode' and charger_mode == 'error' }}"
        sequence:
          - variables:
              message: >
                Cable Juice Planner kunne ikke beregne ladeplanen og lader med maks. strøm.
                Se notifikationerne i Home Assistant.
          - sequence: !input notify_actions
          - sequence: !input amps_actions
          - sequence: !input start_actions
      # ---- normal operation ----
      - conditions: "{{ trigger.id == 'enabled' }}"
        sequence:
          - if: "{{ charger_enabled }}"
            then:
              - sequence: !input enable_actions
            else:
              - sequence: !input disable_actions
      - conditions: "{{ trigger.id == 'amps' and action in ['charge', 'stop'] }}"
        sequence:
          - sequence: !input amps_actions
      - conditions: "{{ trigger.id in ['action', 'start', 'fail_safe'] and action in ['charge', 'stop'] }}"
        sequence:
          - if: "{{ charger_enabled }}"
            then:
              - sequence: !input enable_actions
          - if: "{{ action == 'charge' }}"
            then:
              - sequence: !input amps_actions
              - sequence: !input start_actions
            else:
              - sequence: !input stop_actions
              - sequence: !input amps_actions
