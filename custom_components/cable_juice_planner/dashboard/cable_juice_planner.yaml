  # charging loss per power: apexcharts only has a time axis, so 1 kW is drawn as 1 hour after midnight
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: '@@section_loss@@'
      icon: mdi:chart-bell-curve-cumulative
    - type: markdown
