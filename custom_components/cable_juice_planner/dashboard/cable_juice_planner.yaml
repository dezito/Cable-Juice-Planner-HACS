        data_generator: |
          const b = new Date(); b.setHours(0, 0, 0, 0);
          return (entity.attributes.segments || []).filter(s => s.phases === 1).map(s => [b.getTime() + s.kw * 3600000, s.loss * 100]).sort((x, y) => x[0] - y[0]);
      - entity: sensor.cjp_charging_loss_model
        name: '@@loss_points_3@@'
        type: line
        color: '#eb6834'
        stroke_width: 0
        data_generator: |
          const b = new Date(); b.setHours(0, 0, 0, 0);
          return (entity.attributes.segments || []).filter(s => s.phases !== 1).map(s => [b.getTime() + s.kw * 3600000, s.loss * 100]).sort((x, y) => x[0] - y[0]);
      grid_options: *id001
    - type: custom:apexcharts-card
      header:
        show: true
        title: '@@loss_parts_title@@'
        show_states: false
      graph_span: 12h
      span:
        start: day
      stacked: true
      now:
        show: false
      yaxis:
      - min: 0
        decimals: 0
        apex_config:
          tickAmount: 5
      all_series_config:
