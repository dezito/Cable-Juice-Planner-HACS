        columns: full
    - type: markdown
      card_mod: *id003
      content: |-
        {% set a = states.sensor.cjp_charging_loss_model.attributes %}
        @@loss_intro@@

        {% if a.kwh_per_percent -%}
        | | |
        |:---|---:|
        | **@@loss_kwh_per_percent@@** | **{{ a.kwh_per_percent | round(3) }} kWh** |
        | @@loss_kwh_per_percent_configured@@ ({{ a.battery_size }} kWh, {{ (a.configured_loss * 100) | round(1) }} %) | {{ a.kwh_per_percent_configured | round(3) }} kWh |
        | @@loss_difference@@ | {{ ((a.kwh_per_percent_configured / a.kwh_per_percent - 1) * 100) | round(1) }} % |
        | **@@loss_plan@@** ({{ '@@loss_plan_measured@@' if a.plan_uses_measured else '@@loss_plan_configured@@' }}) | **{{ a.kwh_per_percent_plan | round(3) }} kWh** |

        {% endif -%}
        {% if a.status == 'no_data' -%}
        <ha-alert alert-type="info">@@loss_no_data@@ ({{ (a.configured_loss * 100) | round(1) }} %)</ha-alert>
        {%- elif a.status == 'one_group' -%}
        <ha-alert alert-type="info">@@loss_one_group@@ ({{ ((a.loss_high.loss if a.loss_high else 0) * 100) | round(1) }} % @@loss_with_battery@@ {{ a.battery_size }} kWh)</ha-alert>
        {%- else -%}
        | | |
        |:---|---:|
        | @@loss_fixed@@ (P₀) | **{{ (a.fixed_kw * 1000) | round(0) }} W** |
        {% if a.charger_loss_1_phase is not none %}| @@loss_charger@@ 1 @@loss_phase@@ | **{{ (a.charger_loss_1_phase * 100) | round(1) }} %** |
        {% endif %}{% if a.charger_loss_3_phases is not none %}| @@loss_charger@@ 3 @@loss_phases@@ | **{{ (a.charger_loss_3_phases * 100) | round(1) }} %** |
        {% endif %}| {{ a.loss_low.phases }}×{{ a.loss_low.amps }} A ({{ a.loss_low.kw | round(1) }} kW) | **{{ (a.loss_low.loss * 100) | round(1) }} %** · {{ a.loss_low.kwh_per_percent | round(3) }} kWh/% |
        | {{ a.loss_high.phases }}×{{ a.loss_high.amps }} A ({{ a.loss_high.kw | round(1) }} kW) | **{{ (a.loss_high.loss * 100) | round(1) }} %** · {{ a.loss_high.kwh_per_percent | round(3) }} kWh/% |

        @@loss_low_high_1@@ **{{ (((1 - a.loss_high.loss) / (1 - a.loss_low.loss) - 1) * 100) | round(0) }} %** @@loss_low_high_2@@
        {%- endif %}

        | @@loss_groups@@ | | kWh/% | @@loss_back_to@@ |
        |:---|---:|---:|---:|
        {% for name, count in a.groups.items() -%}
        | {{ name }} | **{{ count }}** | {{ (a.groups_kwh_per_percent[name] | round(3)) if a.groups_kwh_per_percent and a.groups_kwh_per_percent[name] else '–' }} | {{ (as_timestamp(a.group_oldest[name]) | timestamp_custom('%d/%m-%Y')) if a.group_oldest and a.group_oldest[name] else '–' }} |
        {% endfor %}
