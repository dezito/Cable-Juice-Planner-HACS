                    ]);
                  }
                });


                // ------------------------------------------
                // LAST PRICE FROM THE TOMORROW ENTITY
                // ------------------------------------------

                let availableEnd = 0;

                [...today, ...tomorrowPrices].forEach(p => {
                  const end =
                    new Date(p.end).getTime();

                  if (
                    !isNaN(end) &&
