- type: sections
  path: analysis
  title: '@@view_analysis@@'
  max_columns: 4
  dense_section_placement: true
  sections:
  # charging economy per month (engine/economy.py)
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: '@@section_economy@@'
      icon: mdi:cash-multiple
    - type: markdown
      content: "<details><summary>@@read_more@@</summary>\n\n@@economy_explain@@\n\n</details>"
      grid_options:
        columns: full
    - type: markdown
      card_mod:
        style: |
          ha-card {
            --markdown-table-border-color: transparent
          }
      content: |-
        {% set e = states.sensor.cjp_economy.attributes %}
        @@economy_intro@@

        {% if e.months -%}
        | @@economy_month@@ | kWh | @@economy_paid@@ | @@valuta_kwh@@ | @@economy_average@@ | @@economy_daily@@ | @@economy_lowest@@ | @@economy_saved@@ | Score | @@valuta@@/@@distance@@ |
        |:---|---:|---:|---:|---:|---:|---:|---:|---:|---:|
        {% for m in e.months | reverse -%}
        | **{{ m.month }}** | {{ m.kwh | round(0) }} | {{ m.cost | round(0) }} @@valuta@@ | {{ m.unit_price | round(2) if m.unit_price else '–' }} | {{ m.average_unit | round(2) if m.average_unit else '–' }} | {{ m.daily_unit | round(2) if m.daily_unit else '–' }} | {{ m.lowest_unit | round(2) if m.lowest_unit else '–' }} | {{ (m.saving_daily | round(0) | string + ' @@valuta@@') if m.saving_daily is not none else '–' }} | {{ ((m.score * 100) | round(0) | string + ' %') if m.score is not none else '–' }} | {{ m.price_per_km | round(2) if m.price_per_km else '–' }} |
        {% endfor %}

        **@@economy_total@@:** {{ e.total.kwh | round(0) }} kWh, {{ e.total.cost | round(0) }} @@valuta@@{% if e.total.compared_kwh %} · @@economy_saved@@ {{ e.total.saving_daily | round(0) }} @@valuta@@ @@economy_vs_daily@@{% if e.total.score is not none %} · Score {{ (e.total.score * 100) | round(0) }} %{% endif %}{% endif %}
        {%- else -%}
        <ha-alert alert-type="info">@@economy_no_data@@</ha-alert>
        {%- endif %}
      grid_options:
        columns: full
    - type: custom:apexcharts-card
      header:
        show: true
        title: '@@economy_sources_title@@'
        show_states: false
      graph_span: 400d
      span:
        end: month
      stacked: true
      now:
        show: false
      yaxis:
      - min: 0
        decimals: 0
      all_series_config:
        type: column
        unit: ' kWh'
        float_precision: 0
        show:
          legend_value: false
          in_header: false
      apex_config:
        tooltip:
          shared: true
          intersect: false
        chart:
          height: 280px
        dataLabels:
          enabled: false
        xaxis:
          labels:
            format: MMM yy
      series:
      - entity: sensor.cjp_economy
        name: '@@economy_grid@@'
        color: '#2a78d6'
        data_generator: |
          return (entity.attributes.months || []).map(m => { const d = new Date(m.month + '-15T12:00:00');  return [d.getTime(), m.grid]; });
      - entity: sensor.cjp_economy
        name: '@@economy_solar@@'
        color: '#eda100'
        data_generator: |
          return (entity.attributes.months || []).map(m => { const d = new Date(m.month + '-15T12:00:00');  return [d.getTime(), m.solar]; });
      - entity: sensor.cjp_economy
        name: '@@economy_powerwall@@'
        color: '#1baf7a'
        data_generator: |
          return (entity.attributes.months || []).map(m => { const d = new Date(m.month + '-15T12:00:00');  return [d.getTime(), m.powerwall]; });
      - entity: sensor.cjp_economy
        name: '@@economy_public@@'
        color: '#6250d6'
        data_generator: |
          return (entity.attributes.months || []).map(m => { const d = new Date(m.month + '-15T12:00:00');  return [d.getTime(), m.public]; });
      grid_options:
        columns: full
    - type: custom:apexcharts-card
      header:
        show: true
        title: '@@economy_prices_title@@'
        show_states: false
      graph_span: 400d
      span:
        end: month
      now:
        show: false
      yaxis:
      - min: 0
        decimals: 2
      all_series_config:
        type: line
        unit: ' @@valuta_kwh@@'
        float_precision: 2
        stroke_width: 2
        show:
          legend_value: false
          in_header: false
      apex_config:
        tooltip:
          shared: true
          intersect: false
        chart:
          height: 280px
        markers:
          size: 4
        xaxis:
          labels:
            format: MMM yy
      series:
      - entity: sensor.cjp_economy
        name: '@@economy_paid@@'
        color: '#008300'
        data_generator: |
          return (entity.attributes.months || []).filter(m => m.achieved_unit !== null).map(m => { const d = new Date(m.month + '-15T12:00:00');  return [d.getTime(), m.achieved_unit]; });
      - entity: sensor.cjp_economy
        name: '@@economy_average@@'
        color: '#e34948'
        data_generator: |
          return (entity.attributes.months || []).filter(m => m.average_unit !== null).map(m => { const d = new Date(m.month + '-15T12:00:00');  return [d.getTime(), m.average_unit]; });
      - entity: sensor.cjp_economy
        name: '@@economy_daily@@'
        color: '#eb6834'
        data_generator: |
          return (entity.attributes.months || []).filter(m => m.daily_unit !== null).map(m => { const d = new Date(m.month + '-15T12:00:00');  return [d.getTime(), m.daily_unit]; });
      - entity: sensor.cjp_economy
        name: '@@economy_lowest@@'
        color: '#2a78d6'
        data_generator: |
          return (entity.attributes.months || []).filter(m => m.lowest_unit !== null).map(m => { const d = new Date(m.month + '-15T12:00:00');  return [d.getTime(), m.lowest_unit]; });
      grid_options:
        columns: full
  # driving against the outdoor temperature: apexcharts only has a time axis, so -30 °C is drawn at midnight and 1 °C as 1 hour
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: '@@section_drive_temperature@@'
      icon: mdi:snowflake-thermometer
    - type: markdown
      content: "<details><summary>@@read_more@@</summary>\n\n@@drive_temperature_explain@@\n\n</details>"
      grid_options:
        columns: full
    - type: markdown
      content: |-
        {% set a = states.sensor.cjp_analysis.attributes %}
        {% set f = a.temperature_fit %}
        {% if f -%}
        @@drive_temperature_fit_1@@ **{{ (f.per_degree | abs) | round(2) }} @@distance_kwh@@** @@drive_temperature_fit_2@@

        | -10 °C | 0 °C | 10 °C | 20 °C |
        |---:|---:|---:|---:|
        | {{ f.at_minus_10 }} | {{ f.at_0 }} | {{ f.at_10 }} | {{ f.at_20 }} |

        @@drive_temperature_cold_1@@ **{{ ((f.cold_cost or 0) * 100) | round(0) }} %** @@drive_temperature_cold_2@@
        {%- else -%}
        <ha-alert alert-type="info">@@drive_temperature_no_data@@ ({{ a.drives | length if a.drives else 0 }})</ha-alert>
        {%- endif %}
      grid_options:
        columns: full
    - type: custom:apexcharts-card
      header:
        show: true
        title: '@@drive_temperature_title@@'
        show_states: false
      graph_span: 70h
      span:
        start: day
      now:
        show: false
      yaxis:
      - min: 0
        decimals: 1
      all_series_config:
        unit: ' @@distance_kwh@@'
        float_precision: 2
        extend_to: false
        show:
          legend_value: false
          in_header: false
      apex_config:
        chart:
          height: 300px
        markers:
          size:
          - 4
          - 0
        stroke:
          curve: straight
        dataLabels:
          enabled: false
        xaxis:
          labels:
            formatter: |
              EVAL:function (value) { const b = new Date(); b.setHours(0, 0, 0, 0); return Math.round((value - b.getTime()) / 3600000 - 30) + ' °C'; }
          tooltip:
            enabled: false
        tooltip:
          shared: true
          intersect: false
          x:
            formatter: |
              EVAL:function (value) { const b = new Date(); b.setHours(0, 0, 0, 0); return ((value - b.getTime()) / 3600000 - 30).toFixed(1).replace('.', ',') + ' °C'; }
      series:
      - entity: sensor.cjp_analysis
        name: '@@drive_temperature_drives@@'
        type: line
        color: '#2a78d6'
        stroke_width: 0
        data_generator: |
          const b = new Date(); b.setHours(0, 0, 0, 0);
          return (entity.attributes.drives || []).map(d => [b.getTime() + (d.temp + 30) * 3600000, d.km_per_kwh]).sort((x, y) => x[0] - y[0]);
      - entity: sensor.cjp_analysis
        name: '@@drive_temperature_bins@@'
        type: line
        color: '#eb6834'
        stroke_width: 2
        data_generator: |
          const b = new Date(); b.setHours(0, 0, 0, 0);
          return (entity.attributes.temperature_bins || []).map(x => [b.getTime() + ((x.from + x.to) / 2 + 30) * 3600000, x.km_per_kwh]);
      grid_options:
        columns: full
  # ready at departure
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: '@@section_departures@@'
      icon: mdi:car-clock
    - type: markdown
      content: "<details><summary>@@read_more@@</summary>\n\n@@departures_explain@@\n\n</details>"
      grid_options:
        columns: full
    - type: markdown
      content: |-
        {% set a = states.sensor.cjp_analysis.attributes %}
        {% if a.departures -%}
        @@departures_met_1@@ **{{ (a.departures_met * 100) | round(0) }} %** @@departures_met_2@@ {{ a.departures_count }} @@departures_met_3@@

        | @@departures_day@@ | @@departures_level@@ | @@departures_target@@ | @@departures_required@@ | |
        |:---|---:|---:|---:|:---:|
        {% for d in a.departures | reverse -%}
        | {{ d.date[8:10] }}/{{ d.date[5:7] }} {{ d.time }} | {{ d.level | round(0) }} % | {{ d.target | round(0) }} % | {{ d.required | round(0) }} % | {{ '✅' if d.met else '❌' }} |
        {% endfor %}
        {%- else -%}
        <ha-alert alert-type="info">@@departures_no_data@@</ha-alert>
        {%- endif %}
      grid_options:
        columns: full
