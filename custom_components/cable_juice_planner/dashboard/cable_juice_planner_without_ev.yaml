            - entity: sensor.solcast_pv_forecast_forecast_today
              yaxis_id: solar
              type: area
              name: Solcelle prognose
              data_generator: |
                const toUTC00 = (d) => {
                  const x = new Date(d);

                  return new Date(Date.UTC(
                    x.getUTCFullYear(),
                    x.getUTCMonth(),
                    x.getUTCDate(),
                    x.getUTCHours(),
                    0,
                    0,
                    0
                  ));
                };

                const map = new Map();


                // ------------------------------------------
                // OPRET ALLE PRISTIMESTAMPS SOM 0
                // ------------------------------------------

                const addTimes = (rows) => {
                  (rows || []).forEach(row => {
                    if (!row.start)
                      return;

                    const key =
                      toUTC00(row.start).getTime();

                    if (!map.has(key))
                      map.set(key, 0);
                  });
                };


                // I dag
                addTimes(
                  hass.states[
                    'sensor.stromligning_current_price_vat'
                  ]?.attributes?.prices || []
                );


                // I morgen - både forecast og officielle
                const tomorrowEntity =
                  hass.states[
                    'binary_sensor.stromligning_tomorrow_available_vat'
                  ];

                addTimes(
                  tomorrowEntity?.attributes?.prices || []
                );


                // Forecast
                addTimes(
                  hass.states[
                    'sensor.stromligning_forecasts_vat'
                  ]?.attributes?.prices || []
                );


                // ------------------------------------------
                // SOLCAST DATA
                // ------------------------------------------

                const overlay = (series) => {
                  (series || []).forEach(row => {
                    if (!row.period_start)
                      return;

                    const key =
                      toUTC00(
                        row.period_start
                      ).getTime();

                    map.set(
                      key,
                      Number(row.pv_estimate) || 0
                    );
                  });
                };


                overlay(
                  entity.attributes?.detailedHourly || []
                );

                overlay(
                  hass.states[
                    'sensor.solcast_pv_forecast_forecast_tomorrow'
                  ]?.attributes?.detailedHourly || []
                );

                overlay(
                  hass.states[
                    'sensor.solcast_pv_forecast_forecast_day_3'
                  ]?.attributes?.detailedHourly || []
                );

                overlay(
                  hass.states[
                    'sensor.solcast_pv_forecast_forecast_day_4'
                  ]?.attributes?.detailedHourly || []
                );

                overlay(
                  hass.states[
                    'sensor.solcast_pv_forecast_forecast_day_5'
                  ]?.attributes?.detailedHourly || []
                );

                overlay(
                  hass.states[
                    'sensor.solcast_pv_forecast_forecast_day_6'
                  ]?.attributes?.detailedHourly || []
                );

                overlay(
                  hass.states[
                    'sensor.solcast_pv_forecast_forecast_day_7'
                  ]?.attributes?.detailedHourly || []
                );


                return Array.from(
                  map.entries()
                )
                  .sort((a, b) => a[0] - b[0])
                  .map(([time, value]) => [
                    new Date(Number(time)),
                    value
                  ]);
              color: orange
              stroke_width: 0
              opacity: 0.5
              group_by:
                func: avg
                duration: 15min
              show:
                in_brush: true
            - entity: sensor.stromligning_forecasts_vat
              yaxis_id: price
              type: area
              name: Prognose
              unit: ''
              stroke_width: 0
              opacity: 0.25
              color: purple
              data_generator: |
                try {

                  // ------------------------------------------
                  // I DAG
                  // ------------------------------------------

                  const today =
                    hass.states[
                      'sensor.stromligning_current_price_vat'
                    ]?.attributes?.prices || [];


                  // ------------------------------------------
                  // I MORGEN
                  // ------------------------------------------

                  const tomorrowEntity =
                    hass.states[
                      'binary_sensor.stromligning_tomorrow_available_vat'
                    ];

                  const tomorrowPrices =
                    tomorrowEntity?.attributes?.prices || [];

                  const tomorrowIsForecast =
                    tomorrowEntity?.attributes?.forecast_data === true;

                  const officialTomorrow =
                    tomorrowIsForecast
                      ? []
                      : tomorrowPrices;

                  const tomorrowForecast =
                    tomorrowIsForecast
                      ? tomorrowPrices
                      : [];


                  // ------------------------------------------
                  // OFFICIELLE PRISER
                  // ------------------------------------------

                  const official = [
                    ...today,
                    ...officialTomorrow
                  ];


                  // ------------------------------------------
                  // FIND STARTEN PÅ FORECAST
                  // ------------------------------------------

                  let forecastStart = 0;

                  if (tomorrowForecast.length) {
                    forecastStart =
                      Math.min(
                        ...tomorrowForecast
                          .map(p =>
                            new Date(p.start).getTime()
                          )
                          .filter(t =>
                            !isNaN(t)
                          )
                      );
                  }


                  const normalForecast =
                    entity.attributes?.prices || [];


                  if (
                    !forecastStart &&
                    normalForecast.length
                  ) {
                    const times =
                      normalForecast
                        .map(p =>
                          new Date(p.start).getTime()
                        )
                        .filter(t =>
                          !isNaN(t)
                        );

                    if (times.length)
                      forecastStart = Math.min(...times);
                  }


                  if (!forecastStart)
                    return [];


                  // ------------------------------------------
                  // ALLE RÆKKER
                  // ------------------------------------------

                  const rows = [
                    ...official,
                    ...tomorrowForecast,
                    ...normalForecast
                  ];


                  // ------------------------------------------
                  // FIND MAX PRIS
                  // ------------------------------------------

                  let maxP = 0;

                  rows.forEach(row => {
                    const price =
                      Number(row.price);

                    if (
                      Number.isFinite(price) &&
                      price > maxP
                    ) {
                      maxP = price;
                    }
                  });


                  if (maxP <= 0)
                    maxP = 10;


                  // ------------------------------------------
                  // ALLE TIMESTAMPS
                  // ------------------------------------------

                  const times = [
                    ...new Set(
                      rows
                        .map(row =>
                          new Date(
                            row.start
                          ).getTime()
                        )
                        .filter(time =>
                          !isNaN(time)
                        )
                    )
                  ].sort(
                    (a, b) => a - b
                  );


                  if (!times.length) {
                    return [
                      [
                        new Date(forecastStart),
                        maxP
                      ],
                      [
                        new Date(
                          forecastStart +
                          3600000
                        ),
                        maxP
                      ]
                    ];
                  }


                  // ------------------------------------------
                  // 0 FØR FORECAST
                  // MAX EFTER FORECAST
                  // ------------------------------------------

                  return times.map(time => [
                    new Date(time),
                    time >= forecastStart
                      ? maxP
                      : 0
                  ]);


                } catch (e) {

                  console.log(
                    'stromligning forecast_zone error',
                    e
                  );

                  return [];
                }
              group_by:
                func: avg
                duration: 15min
              show:
                in_brush: false
                legend_value: false
