              - Minimum batteriniveau ved hjemkomst fra en tur.
            - **{{ states.number.cjp_min_charge_limit_battery_level.name }}**
              - Bilens minimum mulige opladningsindstilling.
            - **{{ states.number.cjp_max_recommended_charge_limit_battery_level.name }}**
              - Bilproducentens maksimale anbefaling eller maksimal opladningsprocent ved brug af "Cable Juice Planner".
            - **{{ states.number.cjp_preheat_minutes_before.name }}**
              - Forvarm bilen før afgang til arbejde og ture.

            </details>
        - type: custom:numberbox-card
          border: false
          entity: number.cjp_min_daily_battery_level
        - type: custom:numberbox-card
          border: false
          entity: number.cjp_min_trip_battery_level
        - type: custom:numberbox-card
          border: false
          entity: number.cjp_min_charge_limit_battery_level
        - type: custom:numberbox-card
