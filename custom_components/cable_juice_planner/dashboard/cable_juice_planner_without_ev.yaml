        content: |
          ## 📎 Virtuel elbil indstillinger

          <details>
          <summary><b>Læs mere</b></summary>

          - **{{ states.number.cjp_battery_level.name }}** Indstil bilens nuværende batteri niveau
          - **{{ states.number.cjp_estimated_total_range.name }}** Indstil bilens realistiske maks rækkevidde
          </details>
      - type: custom:mushroom-number-card
        entity: number.cjp_battery_level
      - type: custom:mushroom-number-card
        entity: number.cjp_completed_battery_level
      - type: custom:mushroom-number-card
        entity: number.cjp_estimated_total_range
      view_layout:
        position: sidebar
    - type: vertical-stack
      cards:
      - type: custom:stack-in-card
        mode: vertical
        cards:
        - type: markdown
          content: |
            ## 📎 Anbefalet fuld ladning

            <details>
            <summary><b>Læs mere</b></summary>

            Hvis din bil har et LFP-batteri anbefales det mindst en gang hver 14. dag eller som foreskrevet af bilproducenten.

            </details>
        - type: custom:numberbox-card
          border: true
          entity: number.cjp_full_charge_recommended
        - type: custom:mushroom-entity-card
          entity: datetime.cjp_last_full_charge
          fill_container: false
          secondary_info: state
      view_layout:
        position: sidebar
      layout_options:
        grid_columns: 4
        grid_rows: auto
    - type: vertical-stack
      cards:
      - type: vertical-stack
        cards:
        - type: custom:stack-in-card
          mode: vertical
          cards:
          - type: markdown
            content: "## \U0001F4CE Kalkulering af ladetab ##\n\nFor at opnå det bedste resultat anbefales det at lade bilen op fra en lav procent (f.eks. 10%) til 100%.\n\n1. **<font color={% if states.number.cjp_battery_level.state | int > 20 %}red{% else %}lightgreen{% endif %}>Aflad bilen</font>** : \n   - Sørg for at bilen er afladet så meget som muligt.\n   - \"**{{ states.number.cjp_battery_level.name }}**\" er på {{ states.number.cjp_battery_level.state }}% (Maksimum 20%).\n\n2. **<font color={% if states.number.cjp_max_recommended_charge_limit_battery_level.state | int < 90 %}red{% else %}lightgreen{% endif %}>Indstil max ladeprocent</font>**: \n   - Sæt den ønskede ladeprocent i bilen og Home Assistant.\n   - \"**{{ states.number.cjp_max_recommended_charge_limit_battery_level.name }}\"** er sat til {{ states.number.cjp_max_recommended_charge_limit_battery_level.state }}% (Minimum 90%).\n\n3. **Aktiver \"Kalkulere ladetab\"**: Start processen for kalkulering af ladetab. Lad bilen\
              \ selv indikere, når den er fuldt opladet.\n4. **Gem resultatet**: Når opladningen er fuldført, gemmes resultatet automatisk i konfigurationsfilen.\n5. **Modtag notifikation**: Du vil modtage en notifikation på din mobil med resultatet.\n"
          - type: custom:mushroom-entity-card
            entity: switch.cjp_calculate_charging_loss
            fill_container: true
