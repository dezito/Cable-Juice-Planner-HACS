            - **Ekstra billig strøm**: Hvis strømprisen er yderligere 25% billigere, lades batteriet op til "**{{ states.number.cjp_ultra_cheap_grid_charging_max_battery_level.name }}**".
            - "**{{ states.switch.cjp_fill_up.name }}**" skal være aktiveret
            </details>
