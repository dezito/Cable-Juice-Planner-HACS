      - type: conditional
        conditions:
        - condition: state
          entity: sensor.stromligning_current_price_vat
          state_not: unavailable
        card:
          type: custom:config-template-card
          variables:
            today_prices: |
              states['sensor.stromligning_current_price_vat']
                ?.attributes?.prices || []
            tomorrow_prices: |
              (() => {
                const entity =
                  states['binary_sensor.stromligning_tomorrow_available_vat'];

                return entity?.attributes?.prices || [];
              })()
            forecast_prices: |
              states['sensor.stromligning_forecasts_vat']
                ?.attributes?.prices || []
            all_prices: |
              (() => {
                const today =
                  states['sensor.stromligning_current_price_vat']
                    ?.attributes?.prices || [];

                const tomorrowEntity =
                  states['binary_sensor.stromligning_tomorrow_available_vat'];

                const tomorrow =
                  tomorrowEntity?.attributes?.prices || [];

                const tomorrowIsForecast =
                  tomorrowEntity?.attributes?.forecast_data === true;

                const officialTomorrow =
                  tomorrowIsForecast ? [] : tomorrow;

                const official = [
                  ...today,
                  ...officialTomorrow
                ];

                let officialEnd = 0;

                official.forEach(p => {
                  const end = new Date(p.end).getTime();

                  if (!isNaN(end) && end > officialEnd)
                    officialEnd = end;
                });

                const forecast =
                  states['sensor.stromligning_forecasts_vat']
                    ?.attributes?.prices || [];

                const prices = [
                  ...today,
                  ...tomorrow
                ]
                  .map(p => Number(p.price))
                  .filter(Number.isFinite);

                let forecastEnd = 0;

                tomorrow.forEach(p => {
                  const end = new Date(p.end).getTime();

                  if (!isNaN(end) && end > forecastEnd)
                    forecastEnd = end;
                });

                const existingEnd =
                  Math.max(officialEnd, forecastEnd);

                forecast.forEach(p => {
                  const start = new Date(p.start).getTime();
                  const price = Number(p.price);

                  if (
                    start >= existingEnd &&
                    Number.isFinite(price)
                  ) {
                    prices.push(price);
                  }
                });

                return prices;
              })()
            total_hours: |
              vars.all_prices.length
            lowest_price: |
              (() => {
                if (!vars.all_prices.length)
                  return 0;

                return Math.min(...vars.all_prices) * 1.05;
              })()
            highest_price: |
              (() => {
                if (!vars.all_prices.length)
                  return 0;

                return Math.max(...vars.all_prices) * 0.95;
              })()
            mean_price: |
              (() => {
                if (!vars.all_prices.length)
                  return 0;

                return vars.all_prices.reduce(
                  (sum, price) => sum + price,
                  0
                ) / vars.all_prices.length;
              })()
            step_under_mean: |
              (vars.mean_price - vars.lowest_price) / 5
            step_over_mean: |
              (vars.highest_price - vars.mean_price) / 5
            price1: vars.lowest_price
            price2: vars.mean_price - vars.step_under_mean * 4
            price3: vars.mean_price - vars.step_under_mean * 3
            price4: vars.mean_price - vars.step_under_mean * 2
            price5: vars.mean_price - vars.step_under_mean
            price6: vars.mean_price
            price7: vars.mean_price + vars.step_over_mean
            price8: vars.mean_price + vars.step_over_mean * 2
            price9: vars.mean_price + vars.step_over_mean * 3
            price10: vars.mean_price + vars.step_over_mean * 4
            price11: vars.highest_price
            total_span: 24 * 7 - 1
