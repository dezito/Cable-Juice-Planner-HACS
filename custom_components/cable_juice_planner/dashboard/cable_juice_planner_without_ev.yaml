            series:
            - entity: sensor.stromligning_current_price_vat
              yaxis_id: price
              type: column
              name: Inkl. afgifter
              unit: kr.
              color: green
              data_generator: |
                const data = [];

                // ------------------------------------------
                // I DAG
                // ------------------------------------------

                const today =
                  hass.states[
                    'sensor.stromligning_current_price_vat'
                  ]?.attributes?.prices || [];

                today.forEach(p => {
                  const price = Number(p.price);

                  if (Number.isFinite(price)) {
                    data.push([
                      new Date(p.start),
                      price
                    ]);
                  }
                });


                // ------------------------------------------
                // I MORGEN
                // ------------------------------------------

                const tomorrowEntity =
                  hass.states[
                    'binary_sensor.stromligning_tomorrow_available_vat'
                  ];

                const tomorrowPrices =
                  tomorrowEntity?.attributes?.prices || [];

                const tomorrowIsForecast =
                  tomorrowEntity?.attributes?.forecast_data === true;

                const officialTomorrow =
                  tomorrowIsForecast
                    ? []
                    : tomorrowPrices;

                officialTomorrow.forEach(p => {
                  const price = Number(p.price);

                  if (Number.isFinite(price)) {
                    data.push([
                      new Date(p.start),
                      price
                    ]);
                  }
                });


                // ------------------------------------------
                // SIDSTE OFFICIELLE PRIS
                // ------------------------------------------

                let officialEnd = 0;

                [...today, ...officialTomorrow].forEach(p => {
                  const end = new Date(p.end).getTime();

                  if (
                    !isNaN(end) &&
                    end > officialEnd
                  ) {
                    officialEnd = end;
                  }
                });


                // ------------------------------------------
                // FORECAST FOR I MORGEN
                // ------------------------------------------

                if (tomorrowIsForecast) {
                  tomorrowPrices.forEach(p => {
                    const price = Number(p.price);

                    if (Number.isFinite(price)) {
                      data.push([
                        new Date(p.start),
                        price
                      ]);
                    }
                  });
                }


                // ------------------------------------------
                // SIDSTE TOMORROW-TIDSPUNKT
                // ------------------------------------------

                let tomorrowEnd = officialEnd;

                tomorrowPrices.forEach(p => {
                  const end = new Date(p.end).getTime();

                  if (
                    !isNaN(end) &&
                    end > tomorrowEnd
                  ) {
                    tomorrowEnd = end;
                  }
                });


                // ------------------------------------------
                // FORECAST
                // ------------------------------------------

                const forecast =
                  hass.states[
                    'sensor.stromligning_forecasts_vat'
                  ]?.attributes?.prices || [];

                forecast.forEach(p => {
                  const start =
                    new Date(p.start).getTime();

                  const price =
                    Number(p.price);

                  if (
                    start >= tomorrowEnd &&
                    Number.isFinite(price)
                  ) {
                    data.push([
                      new Date(p.start),
                      price
                    ]);
                  }
                });


                return data.sort(
                  (a, b) => a[0] - b[0]
                );
              float_precision: 2
              group_by:
                func: avg
                duration: 15min
              color_threshold:
              - value: ${vars.price1}
                color: '#0064FF'
              - value: ${vars.price2}
                color: '#0096FF'
              - value: ${vars.price3}
                color: '#00B496'
