              opacity: 0.75
              show:
                in_brush: true
            - entity: sensor.stromligning_15min_spotprice_ex_vat
              yaxis_id: price
              type: area
              name: Salgspris
              unit: kr.
              color: white
              stroke_width: 0
              data_generator: |
                const data = [];

                const sellFee = 0.025;

                const nettariff = Number(
                  hass.states[
                    'sensor.stromligning_nettariff_vat'
                  ]?.state
                ) || 0;

                const systemtariff = Number(
                  hass.states[
                    'sensor.stromligning_systemtariff_vat'
                  ]?.state
                ) || 0;

                const sellCosts =
                  nettariff +
                  systemtariff +
                  sellFee;


                // ------------------------------------------
                // I DAG
                // ------------------------------------------

                const today =
                  hass.states[
                    'sensor.stromligning_15min_spotprice_ex_vat'
                  ]?.attributes?.prices || [];

                today.forEach(p => {
                  const spotprice = Number(p.price);

                  if (Number.isFinite(spotprice)) {
                    data.push([
                      new Date(p.start),
                      spotprice - sellCosts
                    ]);
                  }
                });


                // ------------------------------------------
                // I MORGEN
                // ------------------------------------------

                const tomorrowEntity =
                  hass.states[
                    'binary_sensor.stromligning_15min_tomorrow_available_ex_vat'
                  ];

                const tomorrowPrices =
                  tomorrowEntity?.attributes?.prices || [];

                tomorrowPrices.forEach(p => {
                  const spotprice = Number(p.price);

                  if (Number.isFinite(spotprice)) {
                    data.push([
                      new Date(p.start),
                      spotprice - sellCosts
                    ]);
                  }
                });


                // ------------------------------------------
                // SIDSTE PRIS FRA TOMORROW ENTITY
                // ------------------------------------------

                let availableEnd = 0;

                [...today, ...tomorrowPrices].forEach(p => {
                  const end =
                    new Date(p.end).getTime();

                  if (
                    !isNaN(end) &&
                    end > availableEnd
                  ) {
                    availableEnd = end;
                  }
                });


                // ------------------------------------------
                // FORECAST
                // ------------------------------------------

                const forecast =
                  hass.states[
                    'sensor.stromligning_15min_forecasts_ex_vat'
                  ]?.attributes?.prices || [];

                forecast.forEach(p => {
                  const start =
                    new Date(p.start).getTime();

                  const spotprice =
                    Number(p.price);

                  if (
                    start >= availableEnd &&
                    Number.isFinite(spotprice)
                  ) {
                    data.push([
                      new Date(p.start),
                      spotprice - sellCosts
                    ]);
                  }
                });


                return data.sort(
                  (a, b) => a[0] - b[0]
                );
              float_precision: 2
              group_by:
                func: avg
                duration: 15min
