<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Cable Juice Planner: en rød racer-elbil set forfra, der lader fra en glad ladestander, med et ur til planlægningen -->
  <defs>
    <linearGradient id="car" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Ur = planlægning -->
  <circle cx="440" cy="92" r="56" fill="#ffffff" stroke="#1e293b" stroke-width="11"/>
  <circle cx="440" cy="92" r="42" fill="none" stroke="#22c55e" stroke-width="9" stroke-dasharray="66 198" transform="rotate(-90 440 92)"/>
  <path d="M440 92 V62 M440 92 L462 102" stroke="#1e293b" stroke-width="9" stroke-linecap="round"/>
  <circle cx="440" cy="92" r="7" fill="#1e293b"/>

  <!-- Skygge -->
  <ellipse cx="250" cy="446" rx="240" ry="14" fill="#1e293b" opacity="0.15"/>

  <!-- Ladekabel fra standeren til bilens ladeport -->
  <path d="M112 334 C150 372 182 340 212 314"
        fill="none" stroke="#1e293b" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M112 334 C150 372 182 340 212 314"
        fill="none" stroke="#475569" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Ladestander med glad skærm -->
  <rect x="6" y="430" width="120" height="18" rx="8" fill="#475569" stroke="#1e293b" stroke-width="9"/>
  <path d="M22 434 V196 Q22 160 58 160 H74 Q110 160 110 196 V434 Z" fill="url(#box)" stroke="#1e293b" stroke-width="12" stroke-linejoin="round"/>
  <rect x="36" y="184" width="60" height="70" rx="10" fill="#1e293b"/>
  <path d="M48 212 Q54 204 60 212 M72 212 Q78 204 84 212" fill="none" stroke="#4ade80" stroke-width="5" stroke-linecap="round"/>
  <path d="M52 230 Q66 244 80 230" fill="none" stroke="#4ade80" stroke-width="5" stroke-linecap="round"/>
  <path d="M70 272 L46 318 H62 L54 356 L86 306 H68 L80 272 z" fill="url(#bolt)" stroke="#1e293b" stroke-width="6" stroke-linejoin="round"/>
  <!-- Stikholder -->
  <rect x="96" y="314" width="20" height="30" rx="5" fill="#334155" stroke="#1e293b" stroke-width="6"/>

  <!-- Spoiler bag taget -->
  <path d="M250 254 V276 M410 254 V276" stroke="#1e293b" stroke-width="10" stroke-linecap="round"/>
  <rect x="206" y="236" width="248" height="22" rx="9" fill="#dc2626" stroke="#1e293b" stroke-width="9"/>

  <!-- Hjul -->
  <g id="wheel">
    <rect x="180" y="362" width="54" height="78" rx="16" fill="#1e293b"/>
    <rect x="190" y="376" width="16" height="50" rx="7" fill="#dc2626"/>
  </g>
  <use href="#wheel" x="246"/>

  <!-- Kabine og forrude -->
  <path d="M248 304 C256 248 278 214 302 210 H358 C382 214 404 248 412 304 Z" fill="url(#car)" stroke="#1e293b" stroke-width="12" stroke-linejoin="round"/>
  <path d="M268 298 C276 256 292 230 306 226 H354 C368 230 384 256 392 298 Z" fill="#bfdbfe" stroke="#1e293b" stroke-width="8" stroke-linejoin="round"/>
  <path d="M296 286 L328 236 M318 290 L344 250" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.7"/>

  <!-- Bred, rund front -->
  <path d="M196 412 C172 384 176 334 204 314 C226 298 250 292 270 292 H390 C410 292 434 298 456 314 C484 334 488 384 464 412 Z"
        fill="url(#car)" stroke="#1e293b" stroke-width="13" stroke-linejoin="round"/>
  <!-- Glans på skærmene -->
  <path d="M206 342 C210 326 222 314 238 308" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.55"/>
  <path d="M454 342 C450 326 438 314 422 308" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.4"/>
  <!-- Forlygter -->
  <path d="M214 352 L250 336 Q258 336 256 344 L224 362 Q212 364 214 352 Z" fill="#fef9c3" stroke="#1e293b" stroke-width="6" stroke-linejoin="round"/>
  <path d="M446 352 L410 336 Q402 336 404 344 L436 362 Q448 364 446 352 Z" fill="#fef9c3" stroke="#1e293b" stroke-width="6" stroke-linejoin="round"/>
  <!-- Lyn på motorhjelmen -->
  <path d="M352 300 L312 336 H334 L304 366 L362 326 H338 L366 300 Z" fill="url(#bolt)" stroke="#1e293b" stroke-width="6" stroke-linejoin="round"/>
  <!-- Grinende luftindtag -->
  <path d="M262 376 Q330 422 398 376 Q330 396 262 376 Z" fill="#1e293b" stroke="#1e293b" stroke-width="8" stroke-linejoin="round"/>
  <!-- Spoilerlæbe -->
  <rect x="222" y="406" width="216" height="12" rx="6" fill="#1e293b"/>
  <!-- Ladeport med stik -->
  <rect x="210" y="300" width="22" height="26" rx="6" fill="#334155" stroke="#1e293b" stroke-width="6"/>
  <!-- Lyn i luften: bilen får strøm -->
  <path d="M14 0 L0 22 H10 L6 40 L24 14 H13 L18 0 Z" transform="translate(150 226) rotate(-18) scale(1.5)" fill="url(#bolt)" stroke="#1e293b" stroke-width="3.7" stroke-linejoin="round"/>
  <path d="M14 0 L0 22 H10 L6 40 L24 14 H13 L18 0 Z" transform="translate(196 176) rotate(12) scale(1.2)" fill="url(#bolt)" stroke="#1e293b" stroke-width="4.6" stroke-linejoin="round"/>
</svg>
